{% extends "base.html" %}
{% block title %}Positions — Task Manager{% endblock %}

{% block content %}
  <div class="page-header mt-3 mb-4">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title fw-bold">Positions</h2>
        <div class="text-muted mt-1">All available positions</div>
      </div>
      <div class="col-auto">
        <a href="{% url 'tasks:position-create' %}" class="btn btn-primary">
          + New Position
        </a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-vcenter card-table">
        <thead>
        <tr>
          <th>Name</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        {% for position in positions %}
          <tr>
            <td class="fw-medium">{{ position.name }}</td>
            <td class="text-end">
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-center text-muted py-4">
              No positions yet.
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
